name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: POSIX Syntax, ShellCheck & Behavioral Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify POSIX sh syntax
        run: |
          for script in scripts/* tests/*.sh; do
            [ -f "$script" ] || continue
            sh -n "$script"
          done

      - name: Run ShellCheck static analysis
        run: |
          for script in scripts/* tests/*.sh; do
            [ -f "$script" ] || continue
            shellcheck "$script"
          done

      - name: Execute POSIX behavioral test suite
        run: sh ./tests/run.sh
