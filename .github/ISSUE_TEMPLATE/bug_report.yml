name: Bug Report
description: File a reproducible bug or unexpected script behavior in devtools-hub
title: "[Bug]: "
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please ensure you have verified your POSIX shell environment and XDG base directory specifications before filing.
  - type: textarea
    id: symptoms
    attributes:
      label: Bug Description
      description: Clear and concise description of what went wrong.
      placeholder: The POSIX utility script failed when executing under dash/sh...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Exact commands or shell invocation flags to trigger the anomaly.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Shell
      description: Output of `uname -a` and your shell interpreter (e.g., dash, zsh, bash).
      placeholder: Linux Ubuntu / dash
    validations:
      required: true
