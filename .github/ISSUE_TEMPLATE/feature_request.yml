name: Feature Request
description: Suggest a new POSIX utility, completion, or architecture enhancement
title: "[Feature]: "
labels: ["type/enhancement", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a new feature, please verify that it aligns with our core philosophy:
        - **Zero External Dependencies** (pure POSIX shell utilities only).
        - **XDG Base Directory Specification Compliance**.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the operational pain point is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Propose how the utility script or completion module should handle this.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or alternative solutions you've considered.
    validations:
      required: false
